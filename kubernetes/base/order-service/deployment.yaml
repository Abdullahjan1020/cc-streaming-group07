apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: group07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: microservices
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: group07/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: SW_AGENT_NAME
              value: order-service
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-skywalking-helm-oap.group07.svc.cluster.local:11800
            - name: MONGODB_URI
              value: mongodb://mongodb.group07.svc.cluster.local:27017
            - name: MONGODB_DATABASE
              value: order_db
            - name: REDIS_URL
              value: redis://redis.group07.svc.cluster.local:6379/0
            - name: PRODUCT_SERVICE_URL
              value: http://product-service.group07.svc.cluster.local:8002
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.group07.svc.cluster.local:8004
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
