apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: group07
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.17
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          env:
            - name: ETCD_NAME
              value: apisix-etcd
            - name: ETCD_DATA_DIR
              value: /etcd-data
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://etcd-0.etcd.group07.svc.cluster.local:2379
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://etcd-0.etcd.group07.svc.cluster.local:2380
            - name: ETCD_INITIAL_CLUSTER
              value: apisix-etcd=http://etcd-0.etcd.group07.svc.cluster.local:2380
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
