apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: group07
spec:
  type: LoadBalancer
  selector:
    app: apisix
  ports:
    - name: http
      port: 8000
      targetPort: gateway
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: group07
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: admin
      appProtocol: http
