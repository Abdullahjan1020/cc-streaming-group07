apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-public-gateway
  namespace: group07
spec:
  podSelector:
    matchLabels:
      app: apisix
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 9080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-admin-bootstrap-only
  namespace: group07
spec:
  podSelector:
    matchLabels:
      app: apisix
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apisix-config
      ports:
        - port: 9180
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: group07
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["user-service", "product-service", "order-service", "notification-service"]
      ports:
        - port: 27017
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: group07
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["user-service", "product-service", "order-service", "notification-service"]
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: etcd-ingress
  namespace: group07
spec:
  podSelector:
    matchLabels:
      app: etcd
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - port: 2379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-mesh-egress
  namespace: group07
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["apisix", "user-service", "product-service", "order-service", "notification-service", "apisix-config"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["user-service", "product-service", "order-service", "notification-service", "apisix"]
      ports:
        - port: 8001
          protocol: TCP
        - port: 8002
          protocol: TCP
        - port: 8003
          protocol: TCP
        - port: 8004
          protocol: TCP
        - port: 9180
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - port: 27017
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: etcd
      ports:
        - port: 2379
          protocol: TCP
