    newTag: REPLACE_WITH_IMAGE_TAG
  - name: group07/order-service
    newName: REPLACE_WITH_ACR/order-service
    newTag: REPLACE_WITH_IMAGE_TAG
  - name: group07/notification-service
    newName: REPLACE_WITH_ACR/notification-service
    newTag: REPLACE_WITH_IMAGE_TAG
