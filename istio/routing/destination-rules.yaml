apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: apisix-admin-mtls
  namespace: group07
spec:
  host: apisix-admin.group07.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 9180
        tls:
          mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: user-service-mtls
  namespace: group07
spec:
  host: user-service.group07.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 20
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
