[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services"]
include = ["*"]
exclude = ["infrastructure*", "kubernetes*", "apisix*", "istio*", "skywalking*", "monitoring*", "scripts*", "tests*", "docs*", "presentation*"]

[project]
name = "cc-streaming-group07"
version = "0.1.0"
description = "Cloud Computing Group 07 service mesh microservices platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pymongo>=4.13,<5.0",
    "redis[hiredis]>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
